[alembic]
script_location = migrations
prepend_sys_path = .
# A URL vem de EVIDIA_DATABASE_URL (ver migrations/env.py); nada de credencial aqui.

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)s [%(name)s] %(message)s
