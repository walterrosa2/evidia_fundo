[project]
name = "evidia-api"
version = "0.1.0"
description = "Backend de orquestracao e persistencia da Evidia operacional"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # Depends() em default de argumento e o padrao do FastAPI

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
